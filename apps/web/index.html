<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F1" />
    <title>Crewtavo</title>
    <meta name="description" content="Crewtavo: quotes, scheduling, field work and invoicing for service businesses." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Light or dark before first paint (src/lib/theme.ts keeps it up to date). Client pages stay light.
      try {
        var theme = localStorage.getItem("crewtavo.theme");
        if (!/^\/(hub|book|u|refer)\//.test(location.pathname) && (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#191918");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Crewtavo">
        <svg class="boot-mark" viewBox="0 0 211 251" aria-hidden="true"><path fill="#182430" d="M115 0 156.2 23.8 41.5 90 41.5 157.1 115 199.5 115 247.4 0 181 0 66.4Z" /><path fill="#F4B143" d="M156.2 56 211 87.64 211 125.64 156.2 94 70 143.77 70 105.77Z" /><path fill="#182430" d="M156.2 124 211 155.64 211 193.14 156.2 161.5ZM156.2 181.5 211 213.14 211 250.64 156.2 219Z" /></svg>
      </div>
    </div>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
      .boot-mark { width: 40px; height: 48px; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(0.92); opacity: 0.7; } 50% { transform: scale(1); opacity: 1; } }
      .dark .boot { background: #111110; }
      .dark .boot-mark path[fill="#182430"] { fill: #eeeeec; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
