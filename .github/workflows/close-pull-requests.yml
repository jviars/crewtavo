name: Close pull requests

# Crewtavo doesn't accept contributions (CONTRIBUTING.md), so its copyright stays with one owner:
# close pull requests from anyone else as soon as they're opened. pull_request_target runs with this
# repository's token and never checks out the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR" --comment "Thanks, but Crewtavo doesn't accept contributions, so this pull request is closed without review. Bug reports are welcome as issues. See CONTRIBUTING.md."
