name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this for the tagged commit before it publishes anything
  # (release.yml), so the checks stay in one place.
  workflow_call:

# The checks only read the repository. Actions are pinned to a commit, with the version beside it
# (release.yml says why).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Crewtavo takes no outside contributions (CONTRIBUTING.md): every commit is its owner's, with no
      # co-authors. Merges made on GitHub keep the owner as author and GitHub as committer. Each push
      # checks the commits since the last release (the newest version tag before it), or all of them
      # when there isn't one. A release counts as a push too (called from release.yml, the event is
      # the tag's push), so what it adds is checked again before anything is published.
      - name: Authorship
        if: github.event_name == 'push'
        run: |
          since=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          range="${since:+$since..}HEAD"
          others=$(git log --format='%an <%ae>%n%cn <%ce>' "$range" | grep -viE 'jviars|noreply@github\.com' | sort -u)
          if [ -n "$others" ] || git log --format='%B' "$range" | grep -qi '^co-authored-by:'; then
            echo "Every commit must be the owner's, with no co-authors. Others found: $others" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Applies every migration to Postgres in Docker and runs the RLS/workflow tests.
      - run: npm run test:db
      - run: npm run build:server

  # A database with rows in it, as the previous release left it, takes every migration added since
  # (scripts/test-upgrade.sh). test:db above only migrates an empty database, so a migration that
  # fails on existing rows would otherwise first fail on someone's instance.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # All of the history: the script finds the previous release by its tag and takes its files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:upgrade

  # A whole Crewtavo instance, as the Railway template creates it (docker-compose.yml): it must
  # start, apply every migration and reach the "create the owner account" step on its own.
  instance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run instance
      - name: Ready for its owner
        run: |
          curl -sf http://localhost:8080/api/setup | tee setup.json
          node -e 'const s = require("./setup.json"); if (!s.ready || !s.needsOwner) process.exit(1)'
      - if: failure()
        run: docker compose --env-file .env.instance logs --tail 200

  # The lifecycle script and the Playwright browser tests, against a local Supabase.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Postgres, Auth, the REST API, Storage and Mailpit; applies supabase/migrations.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      - name: Write .dev.vars for the local stack
        run: |
          eval "$(supabase status -o env 2>/dev/null)"
          cat > .dev.vars <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$SECRET_KEY
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          APP_URL=http://localhost:4173
          CRON_SECRET=$(openssl rand -hex 24)
          STRIPE_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)
          MAILPIT_URL=$MAILPIT_URL
          EOF
      - name: Start the API
        run: |
          npm run dev:api > api.log 2>&1 &
          for _ in $(seq 1 90); do curl -sf http://localhost:8787/api/health >/dev/null && exit 0; sleep 1; done
          cat api.log
          exit 1
      - run: npm run seed:demo
      - run: npm run test:e2e
      - run: npm run test:browser
      - if: failure()
        run: cat api.log
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
