name: Release

# Publishes the images every Crewtavo instance on Railway runs, when a version tag is pushed:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
#   ghcr.io/jviars/crewtavo:0.1.1      the crewtavo service (the root Dockerfile)
#   ghcr.io/jviars/crewtavo-db:0.1.1   the db service (deploy/postgres), only when it changed
#
# Instances check for new tags and update themselves to the next patch version (0.1.1 → 0.1.2); a
# new minor or major version (0.2.0, 1.0.0) waits for the owner. See deploy/README.md, "Updates".
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # A new database image restarts every instance's database, so publish one only when
          # deploy/postgres changed since the previous release (or there's none yet).
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -z "$previous" ] || ! git diff --quiet "$previous" "$GITHUB_REF_NAME" -- deploy/postgres; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Previous release: ${previous:-none}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: CREWTAVO_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.version.outputs.db
        uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-db:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
